<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Brainrot 2048 — a goofy Galaxy Brain tile with googly eyes surrounded by meme-tile characters">
  <defs>
    <radialGradient id="gp" cx="20%" cy="18%" r="65%">
      <stop offset="0" stop-color="#ff2e88" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gc" cx="84%" cy="88%" r="66%">
      <stop offset="0" stop-color="#2ee0ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2ee0ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Arial Black", Impact, sans-serif; font-weight: 900; }
      .m { font-family: "Courier New", monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#080810"/>
  <rect width="1200" height="800" fill="url(#gp)"/>
  <rect width="1200" height="800" fill="url(#gc)"/>

  <!-- sparkles -->
  <g fill="#ffd43b">
    <path d="M150 360 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/>
    <path d="M1040 250 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z" fill="#2ee0ff"/>
    <path d="M1060 590 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z"/>
    <path d="M120 600 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z" fill="#2ee0ff"/>
  </g>

  <!-- stink / brain-funk squiggles above the hero -->
  <g fill="none" stroke="#6f6c86" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <path d="M520 320 q-16 -26 0 -52 q16 -26 0 -52"/>
    <path d="M600 300 q-16 -26 0 -52 q16 -26 0 -52"/>
    <path d="M680 320 q-16 -26 0 -52 q16 -26 0 -52"/>
  </g>

  <!-- wordmark -->
  <g class="t" text-anchor="middle">
    <text x="606" y="150" font-size="82" fill="#ff2e88" fill-opacity="0.85">BRAINROT</text>
    <text x="595" y="150" font-size="82" fill="#2ee0ff" fill-opacity="0.7">BRAINROT</text>
    <text x="600" y="146" font-size="82" fill="#fbfaf4">BRAINROT</text>
    <text x="600" y="252" font-size="104" fill="#ffd43b" stroke="#080810" stroke-width="3">2048</text>
  </g>

  <!-- little NPC tile (unbothered) -->
  <g transform="translate(248,318) rotate(-13)" class="t" text-anchor="middle">
    <rect x="-62" y="-62" width="124" height="124" rx="18" fill="#26243f" stroke="#4a4868" stroke-width="5"/>
    <circle cx="-24" cy="-12" r="8" fill="#9b98b5"/>
    <circle cx="24" cy="-12" r="8" fill="#9b98b5"/>
    <rect x="-22" y="22" width="44" height="6" rx="3" fill="#9b98b5"/>
    <text x="0" y="54" font-size="15" fill="#9b98b5">NPC</text>
  </g>

  <!-- little SKIBIDI tile (googly) -->
  <g transform="translate(252,572) rotate(10)" class="t" text-anchor="middle">
    <rect x="-64" y="-64" width="128" height="128" rx="18" fill="#243a5e" stroke="#3a5a86" stroke-width="5"/>
    <circle cx="-26" cy="-16" r="17" fill="#fff"/>
    <circle cx="26" cy="-16" r="17" fill="#fff"/>
    <circle cx="-20" cy="-8" r="8" fill="#0a0f1a"/>
    <circle cx="32" cy="-10" r="8" fill="#0a0f1a"/>
    <path d="M-26 24 q26 26 52 0" fill="none" stroke="#8fc7ff" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="58" font-size="14" fill="#8fc7ff">SKIBIDI</text>
  </g>

  <!-- little SIGMA tile (sunglasses) -->
  <g transform="translate(938,372) rotate(9)" class="t" text-anchor="middle">
    <rect x="-66" y="-66" width="132" height="132" rx="18" fill="#4f5016" stroke="#8a8a2a" stroke-width="5"/>
    <rect x="-44" y="-26" width="88" height="26" rx="8" fill="#0a0a05"/>
    <rect x="-42" y="-24" width="34" height="22" rx="6" fill="#1a1a0a"/>
    <rect x="8" y="-24" width="34" height="22" rx="6" fill="#1a1a0a"/>
    <rect x="-36" y="-20" width="10" height="5" rx="2" fill="#2ee0ff"/>
    <path d="M-22 30 q22 14 44 0" fill="none" stroke="#ffe85e" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="56" font-size="15" fill="#ffe85e">SIGMA</text>
  </g>

  <!-- merge plus signs -->
  <g class="t" fill="#2ee0ff" text-anchor="middle" opacity="0.9">
    <text x="360" y="470" font-size="58">+</text>
    <text x="852" y="470" font-size="58">+</text>
  </g>

  <!-- HERO: derpy Galaxy Brain tile -->
  <g transform="translate(600,470) rotate(-5)">
    <rect x="-138" y="-138" width="276" height="276" rx="30" fill="#ff2e88" stroke="#2ee0ff" stroke-width="9"/>
    <!-- eyebrows -->
    <rect x="-92" y="-92" width="58" height="13" rx="6" fill="#1a0a12" transform="rotate(-12 -63 -86)"/>
    <rect x="34" y="-92" width="58" height="13" rx="6" fill="#1a0a12" transform="rotate(12 63 -86)"/>
    <!-- left googly eye -->
    <circle cx="-58" cy="-34" r="47" fill="#fff"/>
    <circle cx="-46" cy="-18" r="22" fill="#1a0a12"/>
    <!-- right hypno eye -->
    <circle cx="58" cy="-34" r="47" fill="#fff"/>
    <circle cx="58" cy="-34" r="35" fill="none" stroke="#1a0a12" stroke-width="7"/>
    <circle cx="58" cy="-34" r="20" fill="none" stroke="#1a0a12" stroke-width="7"/>
    <circle cx="58" cy="-34" r="6" fill="#1a0a12"/>
    <!-- big derp mouth -->
    <path d="M-78 44 q78 86 156 0 q-20 22 -78 22 q-58 0 -78 -22z" fill="#1a0a12"/>
    <rect x="-40" y="40" width="22" height="16" rx="3" fill="#fff"/>
    <rect x="18" y="40" width="22" height="16" rx="3" fill="#fff"/>
    <ellipse cx="6" cy="92" rx="34" ry="20" fill="#ff5c8a"/>
  </g>

  <!-- tagline -->
  <text x="600" y="712" class="m" text-anchor="middle" font-size="29" fill="#b6b3c9" letter-spacing="2">BIG BRAIN ENERGY · ZERO BRAIN CELLS</text>
</svg>
