<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd7e8"/>
      <stop offset="0.55" stop-color="#ffe9c9"/>
      <stop offset="1" stop-color="#b8ecff"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd07a"/>
      <stop offset="1" stop-color="#4f9e56"/>
    </linearGradient>
  </defs>

  <!-- Sky + sun -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="130" cy="110" r="64" fill="#ffd43b" opacity="0.9"/>
  <circle cx="130" cy="110" r="86" fill="#ffd43b" opacity="0.25"/>
  <ellipse cx="620" cy="90" rx="90" ry="26" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="540" cy="120" rx="60" ry="20" fill="#ffffff" opacity="0.6"/>

  <!-- Lawn -->
  <path d="M0 430 Q 400 380 800 430 L 800 600 L 0 600 Z" fill="url(#lawn)"/>

  <!-- Stuff spiralling toward the mouth -->
  <!-- house -->
  <g transform="translate(96 340) rotate(-14)">
    <rect x="-38" y="-6" width="76" height="52" fill="#ffb26b"/>
    <path d="M-48 -4 L0 -44 L48 -4 Z" fill="#e2574c"/>
    <rect x="-12" y="16" width="24" height="30" fill="#7a4a2b"/>
    <rect x="-30" y="6" width="16" height="14" fill="#bfe9ff"/>
    <rect x="16" y="6" width="16" height="14" fill="#bfe9ff"/>
  </g>
  <!-- car -->
  <g transform="translate(206 448) rotate(10)">
    <rect x="-44" y="-12" width="88" height="26" rx="10" fill="#2ee0ff"/>
    <path d="M-24 -12 Q -14 -30 6 -30 Q 24 -30 30 -12 Z" fill="#7ff0ff"/>
    <circle cx="-24" cy="16" r="10" fill="#1c2030"/>
    <circle cx="24" cy="16" r="10" fill="#1c2030"/>
  </g>
  <!-- cat -->
  <g transform="translate(306 372) rotate(-18)">
    <ellipse cx="0" cy="8" rx="26" ry="18" fill="#8a6bff"/>
    <circle cx="20" cy="-8" r="14" fill="#8a6bff"/>
    <path d="M12 -18 L14 -30 L22 -20 Z" fill="#8a6bff"/>
    <path d="M26 -19 L32 -30 L34 -18 Z" fill="#8a6bff"/>
    <circle cx="17" cy="-9" r="2.4" fill="#1c1030"/>
    <circle cx="25" cy="-9" r="2.4" fill="#1c1030"/>
    <path d="M-24 6 Q -40 0 -38 -14" stroke="#8a6bff" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <!-- teddy -->
  <g transform="translate(380 460) rotate(16)">
    <circle cx="0" cy="0" r="16" fill="#c98f5e"/>
    <circle cx="-12" cy="-12" r="6" fill="#c98f5e"/>
    <circle cx="12" cy="-12" r="6" fill="#c98f5e"/>
    <circle cx="-5" cy="-2" r="2" fill="#221a14"/>
    <circle cx="5" cy="-2" r="2" fill="#221a14"/>
    <ellipse cx="0" cy="6" rx="5" ry="4" fill="#8a5a34"/>
  </g>
  <!-- cookie crumbs -->
  <circle cx="330" cy="330" r="7" fill="#b97c3f"/>
  <circle cx="352" cy="306" r="5" fill="#b97c3f"/>
  <circle cx="300" cy="300" r="4" fill="#b97c3f"/>

  <!-- THE BABY -->
  <g transform="translate(575 350)">
    <!-- shadow -->
    <ellipse cx="0" cy="188" rx="180" ry="34" fill="#2c5a34" opacity="0.35"/>
    <!-- diaper bum behind -->
    <ellipse cx="118" cy="142" rx="92" ry="70" fill="#ffffff"/>
    <ellipse cx="118" cy="142" rx="92" ry="70" fill="#c8d2e2" opacity="0.5"/>
    <rect x="60" y="110" width="30" height="16" rx="4" fill="#ffd43b"/>
    <!-- onesie body -->
    <ellipse cx="30" cy="120" rx="105" ry="92" fill="#7ac9ff"/>
    <ellipse cx="60" cy="140" rx="60" ry="50" fill="#4fa8e8" opacity="0.7"/>
    <!-- arm reaching -->
    <ellipse cx="-88" cy="130" rx="34" ry="52" transform="rotate(30 -88 130)" fill="#ffd9b8"/>
    <!-- head -->
    <circle cx="-40" cy="-10" r="118" fill="#ffd9b8"/>
    <!-- hair curl -->
    <path d="M-40 -122 q 30 -26 44 6" stroke="#c98f5e" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- ear -->
    <circle cx="72" cy="-14" r="20" fill="#f0b98f"/>
    <!-- eyes -->
    <circle cx="-84" cy="-38" r="15" fill="#221a14"/>
    <circle cx="-10" cy="-38" r="15" fill="#221a14"/>
    <circle cx="-80" cy="-43" r="5" fill="#ffffff"/>
    <circle cx="-6" cy="-43" r="5" fill="#ffffff"/>
    <!-- cheeks -->
    <ellipse cx="-104" cy="0" rx="20" ry="13" fill="#ff8296" opacity="0.6"/>
    <ellipse cx="14" cy="0" rx="20" ry="13" fill="#ff8296" opacity="0.6"/>
    <!-- open mouth -->
    <ellipse cx="-48" cy="42" rx="44" ry="36" fill="#8c2f39"/>
    <ellipse cx="-48" cy="58" rx="24" ry="14" fill="#ff96a3"/>
    <rect x="-66" y="12" width="14" height="15" fill="#ffffff"/>
    <rect x="-46" y="12" width="14" height="15" fill="#ffffff"/>
    <!-- drool -->
    <ellipse cx="-4" cy="66" rx="7" ry="14" fill="#a0dcff" opacity="0.85"/>
    <!-- bib -->
    <path d="M-92 96 A 52 52 0 0 0 12 96 Z" fill="#ffffff"/>
    <text x="-40" y="122" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#ff2e88">BBB</text>
  </g>

  <!-- Title -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="400" y="560" font-size="76" fill="#141024" stroke="#141024" stroke-width="14" stroke-linejoin="round">BIG BABY BUM</text>
    <text x="400" y="560" font-size="76" fill="#ffd43b">BIG BABY BUM</text>
    <text x="400" y="586" font-size="17" fill="#141024" opacity="0.75" font-family="Arial, sans-serif" font-weight="700">EAT THE NEIGHBORHOOD BEFORE NAP TIME</text>
  </g>
</svg>
