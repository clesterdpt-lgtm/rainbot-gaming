<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Incident Commander key art</title>
  <desc id="desc">A cyber incident command dashboard with neon service nodes, alert traces, and a terminal report panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b15"/>
      <stop offset=".47" stop-color="#111827"/>
      <stop offset="1" stop-color="#02050a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2d"/>
      <stop offset="1" stop-color="#030711"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.88 0 0 0 0 1 0 0 0 .82 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0v58" fill="none" stroke="#2ee0ff" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect width="1400" height="900" fill="url(#grid)" opacity=".72"/>
  <circle cx="1150" cy="120" r="240" fill="#ff2e88" opacity=".12"/>
  <circle cx="260" cy="760" r="260" fill="#2ee0ff" opacity=".1"/>
  <g transform="translate(88 82)">
    <rect width="1224" height="736" rx="32" fill="#02050a" opacity=".88" stroke="#2ee0ff" stroke-opacity=".55" stroke-width="3"/>
    <rect x="34" y="32" width="1156" height="70" rx="12" fill="#101a2d" stroke="#70879f" stroke-opacity=".34"/>
    <text x="62" y="78" fill="#f7f9ff" font-family="JetBrains Mono, Menlo, monospace" font-size="34" font-weight="900">INCIDENT COMMANDER</text>
    <text x="770" y="76" fill="#ffd43b" font-family="JetBrains Mono, Menlo, monospace" font-size="24" font-weight="900">SEV-1 ACTIVE</text>
    <circle cx="1130" cy="66" r="14" fill="#ff5c5c" filter="url(#glow)"/>
    <g transform="translate(38 132)">
      <rect width="690" height="548" rx="18" fill="url(#panel)" stroke="#70879f" stroke-opacity=".36"/>
      <path d="M118 132 C250 40 404 252 560 124" fill="none" stroke="#ff2e88" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 18" opacity=".9"/>
      <path d="M118 342 C270 420 376 228 568 372" fill="none" stroke="#2ee0ff" stroke-width="6" stroke-linecap="round" opacity=".78"/>
      <g filter="url(#glow)">
        <circle cx="118" cy="132" r="48" fill="#101a2d" stroke="#2ee0ff" stroke-width="6"/>
        <circle cx="330" cy="245" r="58" fill="#101a2d" stroke="#ffd43b" stroke-width="6"/>
        <circle cx="560" cy="124" r="50" fill="#101a2d" stroke="#ff5c5c" stroke-width="7"/>
        <circle cx="568" cy="372" r="54" fill="#101a2d" stroke="#6bff7d" stroke-width="6"/>
        <circle cx="226" cy="394" r="44" fill="#101a2d" stroke="#c58cff" stroke-width="6"/>
      </g>
      <text x="83" y="141" fill="#f7f9ff" font-family="JetBrains Mono, Menlo, monospace" font-size="24" font-weight="900">AUTH</text>
      <text x="291" y="254" fill="#f7f9ff" font-family="JetBrains Mono, Menlo, monospace" font-size="24" font-weight="900">API</text>
      <text x="514" y="132" fill="#f7f9ff" font-family="JetBrains Mono, Menlo, monospace" font-size="24" font-weight="900">DB-02</text>
      <text x="526" y="381" fill="#f7f9ff" font-family="JetBrains Mono, Menlo, monospace" font-size="24" font-weight="900">EDGE</text>
      <text x="184" y="402" fill="#f7f9ff" font-family="JetBrains Mono, Menlo, monospace" font-size="24" font-weight="900">LOGS</text>
      <rect x="44" y="468" width="596" height="42" rx="8" fill="#ff5c5c" opacity=".2" stroke="#ff5c5c" stroke-opacity=".58"/>
      <text x="64" y="496" fill="#ffd43b" font-family="JetBrains Mono, Menlo, monospace" font-size="23" font-weight="900">blast_radius: 37 | confidence: 64</text>
    </g>
    <g transform="translate(758 132)">
      <rect width="432" height="548" rx="18" fill="#030711" stroke="#70879f" stroke-opacity=".36"/>
      <text x="34" y="58" fill="#2ee0ff" font-family="JetBrains Mono, Menlo, monospace" font-size="25" font-weight="900">OBSERVATION JSON</text>
      <rect x="32" y="90" width="368" height="280" rx="10" fill="#09111f" stroke="#2ee0ff" stroke-opacity=".2"/>
      <text x="54" y="132" fill="#b8ffde" font-family="JetBrains Mono, Menlo, monospace" font-size="22">{</text>
      <text x="82" y="170" fill="#b8ffde" font-family="JetBrains Mono, Menlo, monospace" font-size="21">"query": "logs auth",</text>
      <text x="82" y="208" fill="#b8ffde" font-family="JetBrains Mono, Menlo, monospace" font-size="21">"root": "unknown",</text>
      <text x="82" y="246" fill="#b8ffde" font-family="JetBrains Mono, Menlo, monospace" font-size="21">"evidence": 4,</text>
      <text x="82" y="284" fill="#b8ffde" font-family="JetBrains Mono, Menlo, monospace" font-size="21">"next": "REPORT"</text>
      <text x="54" y="326" fill="#b8ffde" font-family="JetBrains Mono, Menlo, monospace" font-size="22">}</text>
      <rect x="32" y="404" width="368" height="78" rx="12" fill="#ff2e88" opacity=".16" stroke="#ff2e88" stroke-opacity=".6"/>
      <text x="54" y="452" fill="#fff" font-family="JetBrains Mono, Menlo, monospace" font-size="28" font-weight="900">REPORT ROOT_CAUSE</text>
    </g>
  </g>
</svg>
