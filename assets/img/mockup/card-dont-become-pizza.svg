<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Don't Become Pizza cover art</title>
  <desc id="desc">A moonlit private island with a luxury villa, a glowing underground pizza oven, searchlights, masked silhouettes, and an ominous pizza-slice cloud.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080914"/>
      <stop offset="0.44" stop-color="#101329"/>
      <stop offset="0.78" stop-color="#071118"/>
      <stop offset="1" stop-color="#030406"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c7" stop-opacity="0.92"/>
      <stop offset="0.33" stop-color="#e7cf82" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e7cf82" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ovenGlow" cx="50%" cy="55%" r="58%">
      <stop offset="0" stop-color="#ffd37b"/>
      <stop offset="0.25" stop-color="#ff6e2f"/>
      <stop offset="0.58" stop-color="#8d1418" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#170308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12364a"/>
      <stop offset="0.62" stop-color="#09222e"/>
      <stop offset="1" stop-color="#03070b"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2419"/>
      <stop offset="0.48" stop-color="#17120c"/>
      <stop offset="1" stop-color="#070504"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a9"/>
      <stop offset="0.44" stop-color="#f2b549"/>
      <stop offset="1" stop-color="#b84b25"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0a6" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#fff0a6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff0a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.48 0 0 1 0 0.12 0 0 0 1 0" result="warm"/>
      <feMerge>
        <feMergeNode in="warm"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
    <pattern id="stars" width="180" height="180" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="38" r="1.5" fill="#ffffff" opacity="0.58"/>
      <circle cx="88" cy="21" r="1" fill="#fff6c7" opacity="0.46"/>
      <circle cx="151" cy="72" r="1.2" fill="#ffffff" opacity="0.42"/>
      <circle cx="44" cy="141" r="1" fill="#c6f6ff" opacity="0.35"/>
      <circle cx="134" cy="132" r="1.4" fill="#ffffff" opacity="0.5"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="48%" r="71%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.78"/>
    </radialGradient>
  </defs>

