<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI',Arial,Helvetica,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070f"/>
      <stop offset="0.6" stop-color="#06161a"/>
      <stop offset="1" stop-color="#0a2a26"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.72">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="0.72" stop-color="#e9dcc2"/>
      <stop offset="1" stop-color="#b9a98a"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee0ff"/>
      <stop offset="0.55" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#ff5c5c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070f" stop-opacity="0"/>
      <stop offset="1" stop-color="#04070f" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#2ee0ff" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- data motes / stars -->
  <g fill="#9affd0">
    <circle cx="120" cy="90" r="2.5" opacity="0.7"/><circle cx="300" cy="150" r="2" opacity="0.5"/>
    <circle cx="520" cy="70" r="2.5" opacity="0.6"/><circle cx="700" cy="120" r="2" opacity="0.5"/>
    <circle cx="1120" cy="340" r="2.5" opacity="0.6"/><circle cx="60" cy="300" r="2" opacity="0.5"/>
    <circle cx="240" cy="420" r="2" opacity="0.4"/><circle cx="1160" cy="120" r="2" opacity="0.5"/>
  </g>

  <!-- the moon -->
  <circle cx="985" cy="195" r="118" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="948" cy="162" r="20" fill="#c8b89a" opacity="0.55"/>
  <circle cx="1018" cy="228" r="28" fill="#c8b89a" opacity="0.5"/>
  <circle cx="1006" cy="150" r="11" fill="#c8b89a" opacity="0.5"/>

  <!-- rising "stonks" chart -->
  <polyline points="40,560 180,520 300,540 440,430 560,470 700,330 840,360 980,220"
    fill="none" stroke="#6bff7d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>

  <!-- data surface -->
  <rect x="0" y="648" width="1200" height="152" fill="#081a20"/>
  <rect x="0" y="648" width="1200" height="4" fill="#2ee0ff" opacity="0.7"/>

  <!-- memecoins -->
  <g filter="url(#glow)">
    <circle cx="520" cy="250" r="34" fill="#5fdf6a"/>
    <circle cx="700" cy="300" r="30" fill="#e9b84a"/>
    <circle cx="835" cy="405" r="27" fill="#ff7a33"/>
    <circle cx="410" cy="415" r="26" fill="#c06cff"/>
  </g>
  <g text-anchor="middle" font-weight="900" fill="#0a0a12">
    <text x="520" y="263" font-size="34">P</text>
    <text x="700" y="312" font-size="30">Ð</text>
    <text x="835" y="416" font-size="27">S</text>
    <text x="410" y="425" font-size="26">B</text>
  </g>

  <!-- rocket ascending toward the moon -->
  <g transform="translate(325 470) rotate(-16) scale(1.25)">
    <path d="M-16 62 L16 62 L0 138 Z" fill="url(#flame)" filter="url(#glow)"/>
    <path d="M0 -78 L32 -18 L32 58 L-32 58 L-32 -18 Z" fill="#dfe6f2" stroke="#3a4358" stroke-width="3"/>
    <rect x="-32" y="-18" width="9" height="76" fill="#000" opacity="0.16"/>
    <path d="M-32 30 L-56 64 L-32 58 Z" fill="#ff2e88"/>
    <path d="M32 30 L56 64 L32 58 Z" fill="#ff2e88"/>
    <circle cx="0" cy="-12" r="13" fill="#2ee0ff" stroke="#0a3a44" stroke-width="3"/>
    <circle cx="-4" cy="-16" r="4" fill="#fff" opacity="0.7"/>
  </g>

  <!-- lurking virus -->
  <g transform="translate(150 470)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="26" ry="22" fill="#ff3a5a"/>
    <g stroke="#ff3a5a" stroke-width="4" stroke-linecap="round">
      <path d="M-26 0 L-40 0 M26 0 L40 0 M0 -22 L0 -36 M0 22 L0 36 M-18 -15 L-30 -27 M18 15 L30 27 M18 -15 L30 -27 M-18 15 L-30 27"/>
    </g>
    <circle cx="-8" cy="-3" r="4" fill="#0a0a12"/><circle cx="8" cy="-3" r="4" fill="#0a0a12"/>
  </g>

  <!-- title -->
  <rect x="0" y="470" width="1200" height="330" fill="url(#fade)"/>
  <text x="600" y="712" text-anchor="middle" font-size="128" font-weight="900" fill="url(#title)" letter-spacing="1">TO THE MOON</text>
  <text x="600" y="758" text-anchor="middle" font-size="25" font-weight="700" fill="#9fb0c8" letter-spacing="7">MINE MEMECOINS · SURVIVE THE BEARS · MOON</text>
</svg>
