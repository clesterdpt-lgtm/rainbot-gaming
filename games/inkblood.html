<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#efeade" />
  <title>INKBLOOD 血墨 — Night Parade of One Hundred Demons</title>
  <meta name="description" content="A black-and-white manga horde survivor. Ink, screentone and speed lines — the only colour is blood and the things you cut with. Outlast the Night Parade of One Hundred Demons." />
  <meta property="og:title" content="INKBLOOD 血墨" />
  <meta property="og:description" content="A hand-inked manga horde survivor. Fifteen minutes against the Night Parade of One Hundred Demons." />
  <meta property="og:image" content="https://clesterdpt-lgtm.github.io/rainbot-gaming/assets/img/inkblood/card-inkblood-ai.jpg?v=20260802-ai-1" />
  <meta property="og:image:alt" content="Inkblood cover art: a lone manga swordsman faces a yokai horde beneath a colossal skeleton and crimson ink slashes" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Noto+Sans+JP:wght@700;900&display=swap" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23efeade'/%3E%3Cpath d='M20 78 Q50 8 80 78 Q50 58 20 78Z' fill='%23101014'/%3E%3Ccircle cx='50' cy='42' r='11' fill='%23c01421'/%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --ink: #101014;
      --paper: #efeade;
      --paper-lit: #f8f5ec;
      --blood: #c01421;
      --display: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
      --impact: "Anton", Impact, "Arial Black", sans-serif;
      --jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #ink-root { position: fixed; inset: 0; overflow: hidden; }

    #ink-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* ---------- boot screen ---------- */
    #ink-boot {
      position: absolute;
      inset: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: var(--paper-lit);
      transition: opacity 0.55s ease;
    }
    #ink-boot.is-hidden { opacity: 0; pointer-events: none; }

    /* A rotating ring of ink strokes, drawn in CSS so it shows up
       before a single line of the game engine has parsed. */
    .ink-boot__mark {
      position: relative;
      width: 132px;
      height: 132px;
      display: grid;
      place-items: center;
    }
    .ink-boot__ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 5px solid transparent;
      border-top-color: var(--ink);
      border-right-color: var(--ink);
      animation: ink-spin 1.5s cubic-bezier(0.6, 0.1, 0.3, 0.9) infinite;
    }
    .ink-boot__ring:nth-child(2) {
      inset: 16px;
      border-top-color: var(--blood);
      border-right-color: transparent;
      border-left-color: var(--blood);
      animation-duration: 2.4s;
      animation-direction: reverse;
    }
    .ink-boot__glyph {
      font-family: var(--jp);
      font-weight: 900;
      font-size: 46px;
      color: var(--ink);
      line-height: 1;
    }
    @keyframes ink-spin { to { transform: rotate(360deg); } }

    .ink-boot__title {
      margin: 0;
      font-family: var(--impact);
      font-size: clamp(38px, 8vw, 74px);
      letter-spacing: 0.03em;
      line-height: 0.94;
      text-align: center;
    }
    .ink-boot__sub {
      margin: -12px 0 0;
      font-family: var(--display);
      font-size: clamp(12px, 2.4vw, 17px);
      letter-spacing: 0.34em;
      color: #4a4a52;
      text-align: center;
    }
    .ink-boot__bar {
      width: min(380px, 76vw);
      height: 8px;
      border: 2px solid var(--ink);
      background: transparent;
      overflow: hidden;
    }
    .ink-boot__fill {
      height: 100%;
      width: 2%;
      background: var(--blood);
      transition: width 0.28s ease;
    }
    .ink-boot__status {
      font-family: var(--display);
      font-size: 14px;
      letter-spacing: 0.2em;
      color: #4a4a52;
      min-height: 1.2em;
      text-transform: uppercase;
    }
    .ink-boot__err {
      display: none;
      max-width: min(620px, 88vw);
      font-size: 13px;
      line-height: 1.6;
      color: #7d0a13;
      white-space: pre-wrap;
      text-align: center;
    }
    #ink-boot.has-error .ink-boot__err { display: block; }
    #ink-boot.has-error .ink-boot__ring { animation-play-state: paused; }

    .ink-boot__back {
      position: absolute;
      left: 20px;
      top: 18px;
      font-family: var(--display);
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #4a4a52;
      text-decoration: none;
    }
    .ink-boot__back:hover { color: var(--ink); }

    /* Persistent exit hatch once the game is running. */
    #ink-exit {
      position: absolute;
      left: 14px;
      bottom: 12px;
      z-index: 40;
      font-family: var(--display);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(16, 16, 20, 0.45);
      text-decoration: none;
      padding: 6px 10px;
    }
    #ink-exit:hover { color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      .ink-boot__ring { animation: none; }
    }
  </style>
</head>
<body>
  <div id="ink-root">
    <canvas id="ink-canvas" tabindex="0" aria-label="Inkblood playfield"></canvas>
    <a id="ink-exit" href="../games.html">&larr; Rainbot</a>

    <div id="ink-boot">
      <a class="ink-boot__back" href="../games.html">&larr; Rainbot</a>
      <div class="ink-boot__mark">
        <div class="ink-boot__ring"></div>
        <div class="ink-boot__ring"></div>
        <div class="ink-boot__glyph">血</div>
      </div>
      <h1 class="ink-boot__title">INKBLOOD</h1>
      <p class="ink-boot__sub">NIGHT PARADE OF ONE HUNDRED DEMONS</p>
      <div class="ink-boot__bar"><div class="ink-boot__fill" id="ink-boot-fill"></div></div>
      <div class="ink-boot__status" id="ink-boot-status">Grinding the ink stick</div>
      <div class="ink-boot__err" id="ink-boot-error"></div>
    </div>
  </div>

  <script src="../assets/js/ads.js?v=20260627-profile-stats-1"></script>
  <script src="../assets/js/inkblood/boot.js?v=20260802-1"></script>
</body>
</html>
