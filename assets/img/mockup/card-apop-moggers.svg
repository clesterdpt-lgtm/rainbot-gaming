<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" role="img" aria-label="Apop Demon Moggers poster art">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a3e"/>
      <stop offset="0.55" stop-color="#3a0a2e"/>
      <stop offset="1" stop-color="#120216"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#ec1a5e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120216" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0210" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="700" height="460" fill="url(#sky)"/>

  <!-- stage spotlights -->
  <g opacity="0.16">
    <polygon points="120,-20 60,330 220,330" fill="#2ee0ff"/>
    <polygon points="350,-20 280,330 440,330" fill="#f7d716"/>
    <polygon points="560,-20 470,330 660,330" fill="#ec1a5e"/>
  </g>

  <!-- skyline silhouette -->
  <g fill="#0a0214" opacity="0.85">
    <rect x="0" y="210" width="70" height="130"/>
    <rect x="80" y="170" width="64" height="170"/>
    <rect x="150" y="235" width="58" height="105"/>
    <rect x="430" y="190" width="60" height="150"/>
    <rect x="500" y="220" width="70" height="120"/>
    <rect x="580" y="160" width="64" height="180"/>
    <rect x="650" y="225" width="60" height="115"/>
  </g>
  <!-- lit windows -->
  <g fill="#f7d716" opacity="0.5">
    <rect x="92" y="186" width="8" height="10"/><rect x="112" y="186" width="8" height="10"/>
    <rect x="92" y="210" width="8" height="10"/><rect x="592" y="178" width="8" height="10"/>
    <rect x="612" y="178" width="8" height="10"/><rect x="592" y="202" width="8" height="10"/>
  </g>

  <!-- stage floor -->
  <rect x="0" y="332" width="700" height="128" fill="#150a22"/>
  <rect x="0" y="330" width="700" height="3" fill="#ec1a5e" filter="url(#glow)"/>

  <!-- demon goons -->
  <g>
    <g transform="translate(300,300)">
      <rect x="-16" y="-28" width="32" height="44" rx="8" fill="#a855f7"/>
      <polygon points="-12,-26 -8,-38 -4,-26" fill="#7a1f1f"/>
      <polygon points="4,-26 8,-38 12,-26" fill="#7a1f1f"/>
      <rect x="-12" y="-16" width="9" height="5" fill="#0a0a14"/>
      <rect x="3" y="-16" width="9" height="5" fill="#0a0a14"/>
    </g>
    <g transform="translate(360,306) scale(0.85)">
      <rect x="-16" y="-28" width="32" height="44" rx="8" fill="#fb923c"/>
      <polygon points="-12,-26 -8,-38 -4,-26" fill="#7a1f1f"/>
      <polygon points="4,-26 8,-38 12,-26" fill="#7a1f1f"/>
      <rect x="-12" y="-16" width="9" height="5" fill="#0a0a14"/>
      <rect x="3" y="-16" width="9" height="5" fill="#0a0a14"/>
    </g>
  </g>

  <!-- BOSS: Lucifer Lipsync (right) -->
  <g transform="translate(540,210)">
    <ellipse cx="0" cy="70" rx="80" ry="20" fill="#f7d716" opacity="0.10"/>
    <!-- body -->
    <rect x="-42" y="20" width="84" height="100" rx="16" fill="#1a0a1e"/>
    <!-- red lapels -->
    <polygon points="-6,24 -24,28 -6,86" fill="#7a1f1f"/>
    <polygon points="6,24 24,28 6,86" fill="#7a1f1f"/>
    <!-- gold chain -->
    <path d="M -18,26 Q 0,50 18,26" stroke="#f7d716" stroke-width="3" fill="none"/>
    <circle cx="0" cy="46" r="6" fill="#f7d716"/>
    <!-- head -->
    <circle cx="0" cy="0" r="24" fill="#c97b54"/>
    <!-- horns -->
    <polygon points="-18,-10 -30,-36 -8,-14" fill="#7a1f1f"/>
    <polygon points="18,-10 30,-36 8,-14" fill="#7a1f1f"/>
    <!-- frosted hair -->
    <ellipse cx="0" cy="-12" rx="22" ry="10" fill="#e5e7eb"/>
    <!-- shades -->
    <rect x="-20" y="-4" width="16" height="10" fill="#0a0a14"/>
    <rect x="4" y="-4" width="16" height="10" fill="#0a0a14"/>
    <rect x="-4" y="-2" width="8" height="3" fill="#0a0a14"/>
    <rect x="-16" y="-2" width="5" height="3" fill="#f7d716" opacity="0.6"/>
    <!-- smirk -->
    <path d="M -8,16 Q 0,23 10,14" stroke="#3a0a0a" stroke-width="2.5" fill="none"/>
    <!-- mic -->
    <rect x="-58" y="34" width="6" height="18" rx="2" fill="#0a0a14"/>
    <circle cx="-55" cy="32" r="9" fill="#f7d716"/>
  </g>

  <!-- mog beam -->
  <g filter="url(#glow)">
    <rect x="232" y="244" width="210" height="14" rx="7" fill="url(#beam)"/>
    <path d="M 250,251 l 6,-12 6,12 12,2 -10,8 3,13 -11,-7 -11,7 3,-13 -10,-8 z" fill="#ffffff" transform="translate(150,0) scale(0.9)"/>
  </g>

  <!-- DIVA (left), firing -->
  <g transform="translate(190,210)">
    <!-- legs -->
    <path d="M -4,86 l -8,18 M 6,86 l 10,16" stroke="#3a1030" stroke-width="6" stroke-linecap="round"/>
    <rect x="-16" y="100" width="10" height="5" fill="#f7d716"/>
    <rect x="12" y="98" width="10" height="5" fill="#f7d716"/>
    <!-- dress -->
    <polygon points="0,30 -22,86 22,86" fill="#ec1a5e" stroke="#f7d716" stroke-width="2"/>
    <!-- raised back arm -->
    <path d="M -14,46 l -16,-12" stroke="#fde2c5" stroke-width="5" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="0" cy="14" r="13" fill="#fde2c5"/>
    <!-- hair -->
    <ellipse cx="-2" cy="3" rx="17" ry="11" fill="#ff5c8a"/>
    <ellipse cx="-13" cy="12" rx="7" ry="13" fill="#2ee0ff"/>
    <!-- face -->
    <rect x="4" y="11" width="3" height="3" fill="#0a0a14"/>
    <rect x="2" y="18" width="7" height="3" fill="#dc2626"/>
    <!-- mic arm + mic firing right -->
    <path d="M 8,44 l 16,-6" stroke="#fde2c5" stroke-width="5" stroke-linecap="round"/>
    <rect x="24" y="32" width="6" height="13" rx="2" fill="#0a0a14"/>
    <circle cx="30" cy="30" r="8" fill="#22c55e"/>
  </g>

  <!-- confetti -->
  <g>
    <rect x="250" y="120" width="6" height="6" fill="#f7d716" transform="rotate(20 253 123)"/>
    <rect x="300" y="90" width="6" height="6" fill="#2ee0ff" transform="rotate(40 303 93)"/>
    <rect x="360" y="130" width="6" height="6" fill="#ff5c8a" transform="rotate(15 363 133)"/>
    <rect x="410" y="100" width="6" height="6" fill="#22c55e" transform="rotate(55 413 103)"/>
    <rect x="460" y="140" width="6" height="6" fill="#f7d716" transform="rotate(25 463 143)"/>
    <rect x="330" y="160" width="6" height="6" fill="#a855f7" transform="rotate(35 333 163)"/>
  </g>

  <!-- bottom legibility fade -->
  <rect x="0" y="300" width="700" height="160" fill="url(#fade)"/>

  <!-- title -->
  <g font-family="'Arial Black','Helvetica Neue',Impact,sans-serif" text-anchor="middle">
    <text x="350" y="372" font-size="30" letter-spacing="14" fill="#2ee0ff" font-weight="900" filter="url(#titleGlow)">A&#8202;P&#8202;O&#8202;P</text>
    <text x="350" y="426" font-size="58" letter-spacing="2" fill="#ec1a5e" font-weight="900" filter="url(#titleGlow)">DEMON MOGGERS</text>
  </g>

  <!-- genre / parody pill (top-right, clear of the PLAYABLE badge) -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-weight="700">
    <rect x="498" y="16" width="186" height="22" rx="11" fill="#0a0210" stroke="#f7d716" stroke-opacity="0.6"/>
    <text x="510" y="31" font-size="11" fill="#f7d716">★ SIDE-SCROLLER · PARODY</text>
  </g>
</svg>
