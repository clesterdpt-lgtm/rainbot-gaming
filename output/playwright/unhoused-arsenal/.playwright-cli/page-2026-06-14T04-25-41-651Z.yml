          - generic "▸ Prototype notes" [ref=e185] [cursor=pointer]
          - list [ref=e186]:
            - listitem [ref=e187]: Earn enough cash before night while managing heat and energy.
            - listitem [ref=e188]: Districts change tips, scrap, heat, chase speed, and night pressure.
            - listitem [ref=e189]: Block Favors add district-specific errands with local payouts.
            - listitem [ref=e190]: Amp Rescue adds a heavy carried prop route with a performance finale.
            - listitem [ref=e191]: The chaos director throws crowd, scrap, security, quiet, and haze beats into the run.
            - listitem [ref=e192]: Street Gigs reward chained antics, prop launches, and clean getaways.
            - listitem [ref=e193]: The compass points to the current pickup, dropoff, cache, camp, or kiosk target.
            - listitem [ref=e194]: Press E near glowing caches, pickups, camp, or the pawn kiosk for scavenging and odd jobs.
            - listitem [ref=e195]: High heat starts a chase. Keep distance until the meter cools.
            - listitem [ref=e196]: Space starts a short tumble chain; prop hits extend the combo.
            - listitem [ref=e197]: Buy Mop Spear or Rubber Chicken to change the active J attack.
            - listitem [ref=e198]: At night, Haze Zombies spawn from alleys. Use tools, cones, and prop chaos.
            - listitem [ref=e199]: Survive until morning to bank your score.
          - paragraph [ref=e200]: Satire prototype. The target is absurd systems and slapstick city chaos, not real unhoused people or addiction.
